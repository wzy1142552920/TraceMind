[project]
name = "tracemind"
version = "0.1.0"
description = "Local-first, evidence-driven Java incident localization agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer",
    "rich",
    "pydantic",
    "tree-sitter",
    "tree-sitter-java",
    "openai",
    "jinja2",
    "python-dotenv",
]

[project.scripts]
tracemind = "tracemind.cli.main:app"

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tracemind"]
include = ["src/tracemind/diagnosis/templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "live: requires network and DEEPSEEK_API_KEY",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
